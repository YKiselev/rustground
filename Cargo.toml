[workspace]
resolver = "2"
members = [
    "app",
    "rg_common",
    "rg_ecs",
    "rg_math",
    "rg_macros",
    "rg_net",
    "rg_vulkan",
]

[profile.dev]
opt-level = 0                # Explicitly disables all high-level optimizations
split-debuginfo = "unpacked" # Can improve debugger behavior on macOS/Windows

[workspace.dependencies]
rand = "0.10.2"
serde = "1.0.229"
toml = "1.1.3"
argh = "0.1.13"
mio = "1.0.3"
pastey = "0.2.3"
winit = "0.30.12"
thiserror = "2.0.19"
dirs = "6.0.0"
erased-serde = "0.4.10"
uuid = "1.24.0"
itertools = "0.15.0"
once_cell = "1.21.4"
syn = "3.0.3"
quote = "1.0.47"
proc-macro2 = "1.0.107"
approx = "0.5.1"
num_enum = "0.7.6"
ash = "0.38.0"
ash-window = "0.13.0"
winapi = "0.3.9"
raw-window-handle = "0.6.2"
png = "0.18.1"
pathdiff = "0.2"
glam = "0.33.2"
bitflags = "2.13.1"
fixedbitset = "0.5.7"
indexmap = "2.14.0"
rustc-hash = "2.1.3"
tokio = "1.53.1"
tokio-util = "0.7"
flume = "0.12.0"
bytes = "1.12.1"
tracing = "0.1.44"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
async_zip = "0.0.18"
chrono = "0.4.45"
nohash-hasher = "0.2.0"